    Responsabilidades: 1. Gerar KPIs 2. Exibir dashboards

    Expertise: - Análise de dados - Visualização de KPIs

    Padrões: - Formatos de dashboard - Métricas operacionais

    '
  verbose: true
  allow_delegation: false
  tools:
  - database_tool
  - embedding_tool
agenda_medico_agent:
  role: 'Agente de Gestão da Agenda Médica

    '
